version: '3.8'

services:
  backend:
    build:
      context: ./scholarship-ai-service
      dockerfile: Dockerfile
    image: trongmanh1105/scholarship-backend:latest
    container_name: scholarship-backend
    restart: always
    ports:
      - "7782:7782"
    environment:
      - PORT=7782
      - PROJECT_NAME=Scholarship AI Service
      - VERSION=1.0.0
      - API_KEY=scholarship_internal_secret_key
      - DB_HOST=aws-0-ap-southeast-1.pooler.supabase.com
      - DB_PORT=6543
      - DB_USER=postgres.wzsztxegmqeuwgozlggt
      - DB_PASSWORD=Trongmanh1102205
      - DB_NAME=postgres
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - EMBEDDING_DIM=1536
      - LLM_PROVIDER=google
      - LLM_MODEL=gemini-2.0-flash-lite
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    env_file:
      - ./scholarship-ai-service/.env
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:7782/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./scholarship-web
      dockerfile: Dockerfile
    image: trongmanh1105/scholarship-frontend:latest
    container_name: scholarship-frontend
    restart: always
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - VITE_API_BASE=http://localhost:7782
